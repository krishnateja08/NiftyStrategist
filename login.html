<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>NIFTY STRATEGIST — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --void:#05070d;
  --deep:#0a0f1c;
  --panel:rgba(15,22,38,.55);
  --panel-solid:#0d1420;
  --border:rgba(148,197,255,.14);
  --border-strong:rgba(148,197,255,.32);
  --bull:#00e6a8;
  --bear:#ff5470;
  --gold:#f2b705;
  --cyan:#4fd1ff;
  --text:#eaf1ff;
  --muted:#8493b8;
  --muted2:#465071;
}
html,body{height:100%;background:var(--void);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;overflow-y:auto;}
body{
  background:
    radial-gradient(ellipse 60% 45% at 50% 8%,rgba(79,209,255,.09) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 88% 78%,rgba(242,183,5,.05) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 8% 85%,rgba(0,230,168,.05) 0%,transparent 55%),
    linear-gradient(180deg,#05070d 0%,#080c17 55%,#05070d 100%);
}

/* ══ STARFIELD ══ */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.stars i{position:absolute;width:2px;height:2px;background:#dcecff;border-radius:50%;box-shadow:0 0 4px 1px rgba(148,197,255,.7);animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

/* ══ HOLOGRAPHIC EARTH — sits between logo and login card ══ */
.earth-wrap{position:relative;width:200px;height:200px;margin:10px auto 34px;display:flex;align-items:center;justify-content:center;pointer-events:none;perspective:1200px;animation:fadeUp .7s ease-out .08s both;opacity:.82;filter:saturate(.85);}
.earth-rig{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .2s ease-out;}

.earth-sphere{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 28%,#164d6d 0%,#0c324c 32%,#071e30 62%,#030c17 100%);
  box-shadow:0 0 10px rgba(79,209,255,.1) inset;
}
.earth-texture{position:absolute;top:0;left:0;width:480px;height:240px;display:flex;animation:earthScroll 22s linear infinite;}
.earth-tex-copy{position:relative;width:240px;height:240px;flex:0 0 240px;}
.continent{position:absolute;background:linear-gradient(135deg,rgba(0,230,168,.55),rgba(20,120,90,.55));filter:blur(2px);opacity:.85;}
.c1{width:70px;height:46px;top:38px;left:24px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(-12deg);}
.c2{width:46px;height:60px;top:100px;left:70px;border-radius:45% 55% 40% 60%/55% 40% 60% 45%;transform:rotate(8deg);}
.c3{width:56px;height:34px;top:30px;left:150px;border-radius:50% 50% 40% 60%/60% 40% 55% 45%;}
.c4{width:38px;height:38px;top:150px;left:160px;border-radius:50%;}
.c5{width:60px;height:28px;top:180px;left:40px;border-radius:60% 40% 50% 50%/50% 60% 40% 50%;}

.earth-shade{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.16),transparent 30%),
             radial-gradient(circle at 68% 72%,rgba(0,0,0,.55),transparent 55%),
             linear-gradient(115deg,transparent 45%,rgba(0,0,0,.55) 78%);
}
.earth-atmosphere{
  position:absolute;inset:-8px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 22px rgba(79,209,255,.2),0 0 50px rgba(79,209,255,.08),0 0 90px rgba(0,230,168,.04);
  border:1px solid rgba(148,213,255,.16);
}
@keyframes earthScroll{from{transform:translateX(0)}to{transform:translateX(-240px)}}

.orbit-svg{position:absolute;inset:-46px;width:calc(100% + 92px);height:calc(100% + 92px);overflow:visible;opacity:.55;animation:orbitSpin 50s linear infinite;}
@keyframes orbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.orbit-ring{fill:none;stroke:rgba(79,209,255,.16);}
.orbit-arc{fill:none;stroke:url(#arcGrad);stroke-width:1.4;stroke-dasharray:5 9;filter:drop-shadow(0 0 4px rgba(79,209,255,.55));animation:dash 2.6s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-140;}}
.orbit-node circle{fill:var(--cyan);}
.orbit-node.hot circle{fill:var(--gold);}
.orbit-node .pulse{fill:none;stroke:var(--cyan);stroke-width:1.4;opacity:0;animation:pulse 2.6s ease-out infinite;}
@keyframes pulse{0%{r:5;opacity:.8;stroke-width:2}100%{r:18;opacity:0;stroke-width:.3}}

/* ══ INDEX ORBIT — one small ring of index badges circling the globe ══ */
.idx-orbit{position:absolute;inset:0;pointer-events:none;z-index:2;}
.idx-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:284px;height:284px;}
.idx-spoke{position:absolute;top:0;left:50%;width:0;height:50%;transform-origin:50% 100%;animation:idx-cw 46s linear infinite;}
.idx-badge{
  position:absolute;top:0;left:50%;width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:6.6px;font-weight:700;letter-spacing:.1px;color:var(--cyan);
  background:linear-gradient(150deg,rgba(15,22,38,.88),rgba(6,10,20,.94));
  border:1px solid var(--border);box-shadow:0 0 8px rgba(79,209,255,.14);
  animation:idx-counter-cw 46s linear infinite;
}
.idx-badge.flag-in{
  background:
    radial-gradient(circle at center, rgba(8,12,22,.94) 58%, transparent 59%),
    linear-gradient(180deg,#FF9933 0% 33.3%,#FFFFFF 33.3% 66.6%,#138808 66.6% 100%);
  color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 0 9px rgba(255,153,51,.35);
}
.idx-badge.flag-us{
  background:
    radial-gradient(circle at center, rgba(8,12,22,.94) 58%, transparent 59%),
    linear-gradient(180deg,#3C3B6E 0% 33.3%,#FFFFFF 33.3% 66.6%,#B22234 66.6% 100%);
  color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 0 9px rgba(90,110,220,.35);
}
@keyframes idx-cw{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 360deg))}}
@keyframes idx-counter-cw{from{transform:rotate(calc(-1 * var(--a)))}to{transform:rotate(calc(-1 * var(--a) - 360deg))}}

/* ══ COMETS — streaking across the dark space ══ */
.comets{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.comet{position:absolute;top:0;left:0;width:4px;height:4px;border-radius:50%;background:#ffffff;
  box-shadow:0 0 10px 3px rgba(210,235,255,1);opacity:0;animation-name:comet-move;animation-timing-function:linear;animation-iteration-count:infinite;}
.comet::before{content:'';position:absolute;top:50%;right:100%;width:140px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(210,235,255,.85));transform:translateY(-50%);}
@keyframes comet-move{
  0%{opacity:0;transform:rotate(var(--ang)) translateX(0);}
  6%{opacity:1;}
  80%{opacity:.85;}
  100%{opacity:0;transform:rotate(var(--ang)) translateX(var(--dist));}
}

/* ══ FLOATING TICKER PANEL — single small card, rotates through indices ══ */
.candle-card{
  position:fixed;top:6%;left:4%;width:96px;padding:7px 9px;border-radius:8px;z-index:2;pointer-events:none;
  background:linear-gradient(150deg,rgba(15,22,38,.6),rgba(6,10,20,.75));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);
  animation:cardFloat 6s ease-in-out infinite;
}
.candle-card .cc-label{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:1.1px;color:var(--muted);margin-bottom:4px;transition:opacity .35s ease;}
.candle-card .cc-bars{display:flex;align-items:flex-end;gap:3px;height:24px;margin-bottom:4px;}
.candle-card .cc-bars i{width:3.5px;border-radius:1px;display:block;transition:height .35s ease;}
.candle-card .cc-bars i.up{background:var(--bull);box-shadow:0 0 5px rgba(0,230,168,.5);}
.candle-card .cc-bars i.dn{background:var(--bear);box-shadow:0 0 5px rgba(255,84,112,.5);}
.candle-card .cc-chg{font-family:'JetBrains Mono',monospace;font-size:8.5px;transition:opacity .35s ease;}
.candle-card.fading .cc-label,.candle-card.fading .cc-chg{opacity:0;}
@keyframes cardFloat{0%,100%{transform:translateY(0) rotateY(-6deg);}50%{transform:translateY(-12px) rotateY(6deg);}}

/* ══ HOLOGRAPHIC HUD ══ */
.hud{position:fixed;z-index:2;font-family:'JetBrains Mono',monospace;letter-spacing:1.2px;color:var(--muted);
  bottom:4%;right:4%;padding:5px 9px;pointer-events:none;font-size:9px;display:flex;align-items:center;opacity:.7;}
.hud .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--bull);box-shadow:0 0 6px var(--bull);margin-right:6px;animation:blink 1.4s ease-in-out infinite;}

/* ══ SCENE / STAGE ══ */
.scene{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;perspective:1400px;}

/* ══ LOGO ══ */
.logo-area{text-align:center;margin-bottom:34px;animation:fadeDown .7s ease-out .05s both;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.logo-title{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;letter-spacing:.3px;color:#f2f6ff;}
.logo-title span{color:var(--cyan);text-shadow:0 0 18px rgba(79,209,255,.5);}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted2);letter-spacing:3.5px;margin-top:6px;}

/* ══ LOGIN CARD — mouse-tilted glass slab ══ */
.card-holder{transform-style:preserve-3d;transition:transform .15s ease-out;}
.login-card{
  width:100%;max-width:340px;
  background:linear-gradient(150deg,rgba(15,22,38,.85),rgba(7,11,20,.92));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:10px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(79,209,255,.05),0 1px 0 rgba(255,255,255,.04) inset;
  animation:fadeUp .7s ease-out .12s both;
  transform:translateZ(20px);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card-topbar{height:2px;background:linear-gradient(90deg,var(--bull),var(--cyan),var(--gold));background-size:200% 100%;animation:barShift 5s ease infinite;}
@keyframes barShift{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.card-header{
  padding:18px 26px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
  color:var(--muted);display:flex;justify-content:space-between;align-items:center;
}
.card-header .status{color:var(--bull);display:flex;align-items:center;gap:5px;}
.card-header .dot{width:6px;height:6px;border-radius:50%;background:var(--bull);box-shadow:0 0 8px var(--bull);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
.card-body{padding:26px 30px 30px;}

.btn-google{
  width:100%;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;font-weight:700;color:rgba(220,230,255,.9);
  background:rgba(10,15,28,.6);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-google:hover{border-color:rgba(79,209,255,.35);background:rgba(79,209,255,.06);}
.btn-google svg{width:17px;height:17px;}

.msg{margin-top:12px;padding:10px 14px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;display:none;animation:fadeUp .3s ease-out;}
.msg.error{display:block;background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.25);color:var(--bear);}
.msg.success{display:block;background:rgba(0,230,168,.08);border:1px solid rgba(0,230,168,.25);color:var(--bull);}
.msg.info{display:block;background:rgba(79,209,255,.08);border:1px solid rgba(79,209,255,.2);color:var(--cyan);}

.login-footer{text-align:center;margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.3px;color:var(--muted2);opacity:.75;animation:fadeUp .7s ease-out .22s both;}

.loading-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(5,7,13,.95);flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loading-overlay.active{display:flex;}
.spinner{width:38px;height:38px;border:3px solid rgba(79,209,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--muted);}

@media(max-width:480px){
  .logo-title{font-size:22px;}
  .card-body{padding:18px 18px 22px;}
  .earth-wrap{width:170px;height:170px;margin:0 auto 16px;}
  .earth-texture{width:340px;height:170px;}
  .earth-tex-copy{width:170px;height:170px;flex-basis:170px;}
  @keyframes earthScroll{from{transform:translateX(0)}to{transform:translateX(-170px)}}
  .candle-card{width:84px;padding:6px 8px;}
  .candle-card .cc-bars{height:20px;}
  .hud{padding:4px 7px;}
  .idx-ring{width:200px;height:200px;}
  .idx-badge{width:19px;height:19px;margin:-9.5px 0 0 -9.5px;font-size:5.6px;}
}
@media(prefers-reduced-motion:reduce){
  .earth-texture,.orbit-svg,.card-topbar,.stars i,.candle-card,.hud .dot,.comet,.orbit-arc,.orbit-node .pulse,.idx-spoke,.idx-badge{animation:none!important;}
  .card-holder,.earth-rig{transition:none!important;}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="comets" id="comets"></div>

<div class="candle-card" id="tickerCard">
  <div class="cc-label" id="tickerLabel">NSE · NIFTY 50</div>
  <div class="cc-bars" id="tickerBars">
    <i class="up" style="height:14px"></i><i class="up" style="height:24px"></i><i class="dn" style="height:10px"></i><i class="up" style="height:30px"></i><i class="up" style="height:18px"></i>
  </div>
  <div class="cc-chg" id="tickerChg" style="color:var(--bull)">+0.62%</div>
</div>

<div class="hud"><span class="dot"></span>142 NODES ACTIVE</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">AUTHENTICATING...</div>
</div>

<div class="scene" id="scene">

  <div class="logo-area">
    <div class="logo-title">NIFTY <span>STRATEGIST</span></div>
    <div class="logo-sub">INDIAN STOCK MARKET</div>
  </div>

  <div class="earth-wrap">
    <div class="earth-rig" id="earthRig">

      <div class="earth-sphere">
        <div class="earth-texture">
          <div class="earth-tex-copy">
            <i class="continent c1"></i><i class="continent c2"></i><i class="continent c3"></i><i class="continent c4"></i><i class="continent c5"></i>
          </div>
          <div class="earth-tex-copy">
            <i class="continent c1"></i><i class="continent c2"></i><i class="continent c3"></i><i class="continent c4"></i><i class="continent c5"></i>
          </div>
        </div>
        <div class="earth-shade"></div>
      </div>
      <div class="earth-atmosphere"></div>

      <svg class="orbit-svg" viewBox="0 0 420 420">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4fd1ff"/>
            <stop offset="100%" stop-color="#00e6a8"/>
          </linearGradient>
        </defs>
        <circle class="orbit-ring" cx="210" cy="210" r="170"/>
        <path class="orbit-arc" d="M 60,140 Q 210,40 360,130"/>
        <path class="orbit-arc" d="M 360,130 Q 400,210 350,300"/>
        <path class="orbit-arc" d="M 350,300 Q 210,380 70,290"/>
        <path class="orbit-arc" d="M 70,290 Q 20,210 60,140"/>
        <g class="orbit-node hot"><circle class="pulse" cx="60" cy="140" r="5"/><circle cx="60" cy="140" r="4"/></g>
        <g class="orbit-node hot"><circle class="pulse" cx="70" cy="290" r="5"/><circle cx="70" cy="290" r="4"/></g>
        <g class="orbit-node"><circle class="pulse" cx="360" cy="130" r="5"/><circle cx="360" cy="130" r="4"/></g>
        <g class="orbit-node"><circle class="pulse" cx="350" cy="300" r="5"/><circle cx="350" cy="300" r="4"/></g>
      </svg>

      <div class="idx-orbit">
        <div class="idx-ring">
          <div class="idx-spoke" style="--a:-90deg"><div class="idx-badge flag-in" style="--a:-90deg" title="NSE">NSE</div></div>
          <div class="idx-spoke" style="--a:-18deg"><div class="idx-badge flag-in" style="--a:-18deg" title="BSE">BSE</div></div>
          <div class="idx-spoke" style="--a:54deg"><div class="idx-badge flag-us" style="--a:54deg" title="NASDAQ">NDQ</div></div>
          <div class="idx-spoke" style="--a:126deg"><div class="idx-badge flag-us" style="--a:126deg" title="S&amp;P 500">SPX</div></div>
          <div class="idx-spoke" style="--a:198deg"><div class="idx-badge flag-us" style="--a:198deg" title="Dow Jones">DJI</div></div>
        </div>
      </div>

    </div>

  </div>

  <div class="card-holder" id="cardHolder">
    <div class="login-card">
      <div class="card-topbar"></div>
      <div class="card-header">
        <span>AUTHENTICATION</span>
        <span class="status"><span class="dot"></span>SECURE</span>
      </div>
      <div class="card-body">

        <button class="btn-google" onclick="handleGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.04 10.04 0 001 12c0 1.61.39 3.14 1.07 4.49l3.77-2.4z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          CONTINUE WITH GOOGLE
        </button>

        <div class="msg" id="authMsg"></div>
      </div>
    </div>
  </div>

  <div class="login-footer">NIFTY MARKETS HUB // SECURE ACCESS // v3.1</div>
</div>

<!-- Firebase SDKs (compat for simplicity) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ══ Firebase Config ══
// These are safe to be public — security is enforced by Firebase Security Rules
var firebaseConfig = {
  apiKey: "%%FIREBASE_API_KEY%%",
  authDomain: "%%FIREBASE_AUTH_DOMAIN%%",
  projectId: "%%FIREBASE_PROJECT_ID%%",
  storageBucket: "%%FIREBASE_STORAGE_BUCKET%%",
  messagingSenderId: "%%FIREBASE_MESSAGING_SENDER_ID%%",
  appId: "%%FIREBASE_APP_ID%%"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();

// ══ Check if already logged in ══
auth.onAuthStateChanged(function(user) {
  if (user) {
    showLoading('WELCOME BACK, ' + (user.displayName || user.email).toUpperCase() + '...');
    setTimeout(function() { window.location.href = './index.html'; }, 800);
  }
});

// ══ Messages ══
function showMsg(text, type) {
  var el = document.getElementById('authMsg');
  el.className = 'msg ' + type;
  el.textContent = text;
}
function clearMsg() { document.getElementById('authMsg').className = 'msg'; document.getElementById('authMsg').textContent = ''; }
function showLoading(text) {
  var overlay = document.getElementById('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = text || 'AUTHENTICATING...';
  overlay.classList.add('active');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

// ══ Google Sign-In ══
function handleGoogle() {
  var provider = new firebase.auth.GoogleAuthProvider();
  showLoading('CONNECTING TO GOOGLE...');
  auth.signInWithPopup(provider)
    .then(function(result) {
      showLoading('ACCESS GRANTED — LOADING TERMINAL...');
      setTimeout(function() { window.location.href = './index.html'; }, 600);
    })
    .catch(function(err) {
      hideLoading();
      if (err.code === 'auth/popup-closed-by-user') return;
      showMsg('Google sign-in failed. Try again.', 'error');
    });
}

// ══ Starfield ══
(function(){
  var wrap = document.getElementById('stars');
  var frag = document.createDocumentFragment();
  for (var i=0;i<150;i++){
    var s = document.createElement('i');
    var size = 1 + Math.random()*2.2;               // 1–3.2px, some stars look closer/bigger
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.boxShadow = '0 0 ' + (size*2.5) + 'px ' + (size*0.6) + 'px rgba(148,197,255,.7)';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5 + Math.random()*2.5)+'s';
    frag.appendChild(s);
  }
  wrap.appendChild(frag);
})();

// ══ Comets — streaking shooting stars across the space background ══
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('comets');
  if (reduceMotion || !wrap) return;

  function spawnComet(){
    var c = document.createElement('i');
    c.className = 'comet';
    var startTop = Math.random()*70;              // start mostly in upper 70% of screen
    var startLeft = Math.random()*70 - 10;         // start mostly left/center, can go slightly off-screen
    var angle = 25 + Math.random()*40;             // travel down-right, 25–65deg
    var dist = 450 + Math.random()*450;            // travel distance in px
    var duration = 1.4 + Math.random()*1.2;        // fast 1.4–2.6s streak
    c.style.top = startTop + '%';
    c.style.left = startLeft + '%';
    c.style.setProperty('--ang', angle + 'deg');
    c.style.setProperty('--dist', dist + 'px');
    c.style.animationDuration = duration + 's';
    c.style.animationIterationCount = '1';
    wrap.appendChild(c);
    setTimeout(function(){ c.remove(); }, duration*1000 + 100);
  }

  function loop(){
    spawnComet();
    setTimeout(loop, 550 + Math.random()*500);      // a new comet roughly every ~0.55–1.05s
  }
  loop();
})();

// ══ Ticker rotation — cycles the one small panel through the 4 indices ══
(function(){
  var card = document.getElementById('tickerCard');
  var labelEl = document.getElementById('tickerLabel');
  var barsEl = document.getElementById('tickerBars');
  var chgEl = document.getElementById('tickerChg');
  if (!card) return;

  var indices = [
    { label: 'NSE · NIFTY 50', heights: [14,24,10,30,18], dirs: ['up','up','dn','up','up'], chg: '+0.62%', color: 'var(--bull)' },
    { label: 'BSE · SENSEX',   heights: [16,12,27,22,32], dirs: ['up','dn','up','up','up'], chg: '+0.58%', color: 'var(--bull)' },
    { label: 'NASDAQ 100',     heights: [12,24,34,15,28], dirs: ['up','up','up','dn','up'], chg: '+0.91%', color: 'var(--bull)' },
    { label: 'NYSE · DOW',     heights: [26,16,20,9,14],  dirs: ['dn','up','dn','dn','up'], chg: '−0.14%', color: 'var(--bear)' }
  ];

  var i = 0;
  function render(idx){
    var d = indices[idx];
    labelEl.textContent = d.label;
    chgEl.textContent = d.chg;
    chgEl.style.color = d.color;
    var bars = barsEl.children;
    for (var b = 0; b < bars.length; b++) {
      bars[b].style.height = d.heights[b] + 'px';
      bars[b].className = d.dirs[b];
    }
  }
  render(0);

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  setInterval(function(){
    card.classList.add('fading');
    setTimeout(function(){
      i = (i + 1) % indices.length;
      render(i);
      card.classList.remove('fading');
    }, 350);
  }, 3800);
})();

// ══ 3D mouse-parallax: card tilt + earth tilt ══
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  var cardHolder = document.getElementById('cardHolder');
  var earthRig = document.getElementById('earthRig');
  window.addEventListener('mousemove', function(e){
    var nx = (e.clientX / window.innerWidth) - 0.5;
    var ny = (e.clientY / window.innerHeight) - 0.5;
    cardHolder.style.transform = 'rotateY(' + (nx*10) + 'deg) rotateX(' + (-ny*10) + 'deg)';
    earthRig.style.transform = 'rotateY(' + (nx*14) + 'deg) rotateX(' + (-ny*14) + 'deg)';
  });
})();
</script>
